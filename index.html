<style>
/* Layout: one-column phone app; one task per screen, big numerals, streak shown as pomegranate seeds. */
:root {
  --paper: #FBF6F7; --card: #FFFFFF; --ink: #2A1A1F; --muted: #76606A; --line: #EADCE0;
  --garnet: #A3263A; --seed: #E14A64; --seed-soft: #F7D3DA; --leaf: #3D7A4C; --leaf-soft: #DCEBDF;
  --warn: #9A5B00; --warn-soft: #FBEBD2;
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #1A1114; --card: #241A1E; --ink: #F5E9EC; --muted: #B79FA6; --line: #3B2B31;
  --garnet: #E85A70; --seed: #FF7A90; --seed-soft: #4A2630; --leaf: #7FC290; --leaf-soft: #22352A;
  --warn: #F2B566; --warn-soft: #3A2C16; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #1A1114; --card: #241A1E; --ink: #F5E9EC; --muted: #B79FA6; --line: #3B2B31;
  --garnet: #E85A70; --seed: #FF7A90; --seed-soft: #4A2630; --leaf: #7FC290; --leaf-soft: #22352A;
  --warn: #F2B566; --warn-soft: #3A2C16; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 17px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 32px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2rem; font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 40px; height: 40px; flex: none; }
.brand span { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; color: var(--garnet); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.btn { appearance: none; border: 0; border-radius: 14px; padding: 16px 20px; font: 700 1.1rem var(--f-body); cursor: pointer;
  background: var(--garnet); color: #fff; min-height: 56px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--line); font-weight: 400; font-size: 1rem; }
.btn:focus-visible, input:focus-visible, .choice:focus-visible, a:focus-visible { outline: 3px solid var(--seed); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
a { color: var(--garnet); }

/* week of seeds */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.week div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .75rem; color: var(--muted); letter-spacing: .04em; }
.week svg { width: 26px; height: 30px; }
.streak { display: flex; align-items: baseline; gap: 8px; }
.streak b { font-family: var(--f-display); font-size: 2.4rem; color: var(--seed); font-variant-numeric: tabular-nums; }

/* task */
.progress { height: 8px; background: var(--seed-soft); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--seed); border-radius: 99px; transition: width .3s; }
.label { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.prompt { font-family: var(--f-body); font-weight: 700; font-size: clamp(2.2rem, 11vw, 3.4rem); line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.prompt.long { font-size: clamp(1.3rem, 5.6vw, 1.7rem); line-height: 1.35; }
.hint { font-size: .95rem; color: var(--muted); }
.answer { width: 100%; font: 700 2rem var(--f-body); padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
.answer:focus { border-color: var(--seed); outline: none; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { appearance: none; border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 14px; padding: 16px 10px; font: 700 1.25rem var(--f-body); cursor: pointer; min-height: 60px; }
.saved { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; color: var(--leaf); padding: 28px 0; }
.ladder-tag { display: inline-block; align-self: flex-start; background: var(--leaf-soft); color: var(--leaf); border-radius: 99px; padding: 3px 10px; font-size: .82rem; font-weight: 700; }
.moods { display: flex; gap: 12px; justify-content: center; }
.moods button { font-size: 2.4rem; background: var(--paper); border: 2px solid var(--line); border-radius: 18px; width: 76px; height: 76px; cursor: pointer; }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; }
.thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: .92rem; }
.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.foot { text-align: center; }
.rangebar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px; }
.seg { appearance: none; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 7px 14px; font: 700 .92rem var(--f-body); cursor: pointer; min-height: 38px; }
.seg[aria-pressed="true"] { background: var(--garnet); border-color: var(--garnet); color: #fff; }
.weekhead { margin-top: 4px; color: var(--muted); font-size: .95rem; }
.day summary { display: flex; flex-direction: column; gap: 8px; list-style: none; }
.day summary::-webkit-details-marker { display: none; }
.day summary::after { content: "Prikaži zadatke ▾"; font-size: .85rem; color: var(--garnet); font-weight: 700; }
.day[open] summary::after { content: "Sakrij zadatke ▴"; }
.day-m { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .9rem; color: var(--muted); }
.zr { gap: 16px; }
.zr-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.zr-big { font-size: 1.1rem; }
.zr-big b { font-family: var(--f-display); font-size: 3rem; line-height: 1; color: var(--garnet); font-variant-numeric: tabular-nums; margin-right: 4px; }
.zr-earned { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.zr-earned .num { font-family: var(--f-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.zr-bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); }
.zr-bar i { display: block; height: 100%; }
.zr-bar .sp, .zr-legend .sp { background: var(--muted); }
.zr-bar .hd, .zr-legend .hd { background: var(--warn); }
.zr-bar .fr, .zr-legend .fr { background: var(--seed); }
.zr-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.zr-legend span { display: inline-flex; align-items: center; gap: 6px; }
.zr-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.zr-legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
.zr-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; font-size: .88rem; color: var(--muted); }
.chip b { color: var(--ink); }
.zr-owed { display: flex; gap: 12px; align-items: center; background: var(--leaf-soft); color: var(--leaf); border-radius: 14px; padding: 12px 14px; }
.zr-owed > span svg { width: 26px; height: 30px; display: block; }
.zr-owed p { color: var(--ink); opacity: .8; }
.zr-head { display: flex; align-items: center; gap: 10px; }
.zr-req { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.zr-req .row { grid-column: 1 / -1; }
.zr-req .row .btn { min-height: 44px; padding: 8px 14px; font-size: 1rem; }
.zr-cost { width: 56px; height: 56px; border-radius: 50%; background: var(--seed-soft); color: var(--garnet); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.zr-cost b { font-family: var(--f-display); font-size: 1.4rem; }
.zr-cost span { font-size: .7rem; }
.hist { display: flex; flex-direction: column; }
.hist-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist-row:last-child { border-bottom: 0; }
.zr-what { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 10px 12px; text-decoration: none; color: var(--muted); font-weight: 700; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--garnet); border-bottom-color: var(--garnet); }
.rep h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rep .body { display: flex; flex-direction: column; gap: 8px; }
.rep .body ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.rep .body h4 { margin: 6px 0 0; font-family: var(--f-display); font-size: 1rem; }
.obs-ev { margin: 0; padding-left: 1.2em; font-size: .9rem; color: var(--muted); }
textarea.answer { font-size: 1rem; font-weight: 400; min-height: 90px; resize: vertical; }
.donecount { font-size: 1.15rem; }
.donecount b { font-family: var(--f-display); color: var(--garnet); }
.taskhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pausebtn { appearance: none; border: 1.5px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 6px 14px; font: 700 .9rem var(--f-body); cursor: pointer; min-height: 36px; }
.modal { position: fixed; inset: 0; z-index: 50; background: var(--paper); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal .card { max-width: 440px; width: 100%; text-align: center; align-items: center; }
.modal svg { width: 72px; height: 72px; }
.basket { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.basket b { font-family: var(--f-display); font-size: 2.4rem; color: var(--garnet); font-variant-numeric: tabular-nums; }
.reward { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.reward .btn { min-height: 44px; padding: 10px 16px; font-size: 1rem; flex: none; }
.req { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding: 8px 0; }
.req .row .btn { min-height: 40px; padding: 8px 14px; font-size: .95rem; flex: none; }
.foot a { color: var(--muted); font-size: .85rem; }

/* parent */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .cat { font-weight: 700; }
.stat .num { font-variant-numeric: tabular-nums; }
.pill { display: inline-block; border-radius: 99px; padding: 2px 10px; font-size: .82rem; font-weight: 700; }
.pill.ok { background: var(--leaf-soft); color: var(--leaf); }
.pill.no { background: var(--seed-soft); color: var(--garnet); }
.pill.skip { background: var(--warn-soft); color: var(--warn); }
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
tr.lad td:first-child { padding-left: 22px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 700; }
.status { display: flex; align-items: center; gap: 12px; }
.status .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="topbar"><div class="brand" id="brand"></div></div>
  <div class="card"><p class="muted">Učitavam…</p></div>
</div>

<script>
/* ---------- content: baseline v1 (from spec "Baseline nacrt") ---------- */
const N = (id, prompt, answer, extra = {}) => ({ id, type: "num", prompt, answer: String(answer), ...extra });
const C = (id, prompt, answer, options, extra = {}) => ({ id, type: "choice", prompt, answer, options, ...extra });
const fact = (id, p, a, ladder) => N(id, p, a, ladder ? { ladder } : {});

const DAYS = [
  { title: "Zbrajanje do 20 i tablica množenja", items: [
    fact("A1","8 + 7",15), fact("A2","9 + 5",14), fact("A3","7 + 6",13), fact("A4","14 − 9",5), fact("A5","16 − 8",8), fact("A6","12 − 5",7),
    fact("B1","7 · 8",56), fact("B2","6 · 9",54), fact("B3","8 · 6",48), fact("B4","9 · 7",63), fact("B5","7 · 7",49), fact("B6","8 · 9",72),
    fact("B7","6 · 7",42), fact("B8","4 · 8",32), fact("B9","9 · 9",81), fact("B10","3 · 7",21), fact("B11","6 · 6",36), fact("B12","8 · 8",64) ] },
  { title: "Dijeljenje, mjesne vrijednosti i jedan pisani račun", items: [
    fact("C1","56 : 7",8), fact("C2","63 : 9",7), fact("C3","48 : 6",8), fact("C4","72 : 8",9), fact("C5","42 : 7",6), fact("C6","54 : 9",6),
    N("D1","Koja znamenka je na mjestu stotica u broju 58 341?",3,{long:true}),
    fact("D2","34 · 100",3400), fact("D3","40 · 7",280,[N("D3a","4 · 7",28)]),
    fact("D4","1 400 : 20",70,[N("D4a","14 : 2",7)]), fact("D5","3 600 : 60",60,[N("D5a","36 : 6",6)]),
    N("P1","236 · 47",11092,{hint:"Pisani račun: riješi na papiru, upiši samo rezultat."}) ] },
  { title: "Pisani računi i mjerne jedinice", items: [
    N("P2","4 536 : 18",252,{hint:"Pisani račun: riješi na papiru, upiši samo rezultat."}),
    N("P3","9 004 − 3 768",5236,{hint:"Pisani račun: riješi na papiru, upiši samo rezultat."}),
    N("E1","3 h 15 min = ? min",195,{long:true,ladder:[N("E1a","1 h = ? min",60,{long:true}),N("E1b","3 · 60",180)]}),
    N("E2","2 kg 40 dag = ? dag",240,{long:true,ladder:[N("E2a","1 kg = ? dag",100,{long:true})]}),
    N("E3","5 m 3 cm = ? cm",503,{long:true,ladder:[N("E3a","1 m = ? cm",100,{long:true})]}),
    N("E4","Račun je 37 €, platila si 50 €. Koliko ti se vraća? (u €)",13,{long:true}) ] },
  { title: "Skupovi, izrazi, kvadrati i prve jednadžbe", items: [
    C("F1","A = {2, 4, 6, 8}, B = {3, 6, 9}. Koliko je A ∩ B?","{6}",["{6}","{2, 3, 4, 6, 8, 9}","{3, 9}","∅"],{long:true}),
    N("F2","A = {2, 4, 6, 8}, B = {3, 6, 9}. Koliko elemenata ima A ∪ B?",6,{long:true}),
    C("F3","A = {2, 4, 6, 8}. Je li 5 ∈ A?","Ne",["Da","Ne"],{long:true}),
    C("G1","Dvokratnik broja a umanjen za 3","2 · a − 3",["2 · a − 3","2 · (a − 3)","a − 3 · 2","a : 2 − 3"],{long:true}),
    N("G2","Vrijednost izraza 3 · d + 4 za d = 6",22,{long:true,ladder:[N("G2a","3 · 6",18)]}),
    C("G3","Pojednostavni: 5x + 3x − x","7x",["7x","8x","9x","7"],{long:true}),
    N("H1","7²",49), N("H2","3² + 4²",25,{ladder:[N("H2a","4²",16)]}),
    N("I1","x + 38 = 95\nx = ?",57,{ladder:[C("I1a","Nepoznati pribrojnik dobijemo ovako:","95 − 38",["95 − 38","95 + 38"],{long:true}),N("I1b","95 − 38",57)]}),
    N("I2","120 − x = 45\nx = ?",75,{ladder:[C("I2a","Nepoznati umanjitelj dobijemo ovako:","120 − 45",["120 − 45","120 + 45"],{long:true}),N("I2b","120 − 45",75)]}),
    N("I3","8 · x = 72\nx = ?",9,{ladder:[C("I3a","Nepoznati faktor dobijemo ovako:","72 : 8",["72 : 8","72 · 8"],{long:true}),N("I3b","72 : 8",9)]}) ] },
  { title: "Jednadžbe i nejednadžbe", items: [
    N("I4","x : 7 = 9\nx = ?",63,{ladder:[C("I4a","Nepoznati djeljenik dobijemo ovako:","9 · 7",["9 · 7","9 : 7"],{long:true}),N("I4b","9 · 7",63)]}),
    N("I5","84 : x = 12\nx = ?",7,{ladder:[C("I5a","Nepoznati djelitelj dobijemo ovako:","84 : 12",["84 : 12","84 · 12"],{long:true}),N("I5b","84 : 12",7)]}),
    N("I6","2 · x + 7 = 25\nx = ?",9,{ladder:[N("I6a","2 · x + 7 = 25\nKoliko je 2 · x?",18,{long:true}),N("I6b","18 : 2",9)]}),
    N("I7","180 : (x : 4) = 20\nx = ?",36,{ladder:[N("I7a","180 : (x : 4) = 20\nKoliko je x : 4?",9,{long:true}),N("I7b","9 · 4",36)]}),
    N("J1","Koji je najveći prirodni broj x za koji vrijedi 3 · x < 20?",6,{long:true}),
    N("J2","Koliko brojeva iz N₀ zadovoljava x + 4 < 9?",5,{long:true}) ] }
];
const CAT = { A:"Zbrajanje i oduzimanje do 20", B:"Tablica množenja", C:"Tablica dijeljenja", D:"Mjesne vrijednosti, ·/: s 10 i 100",
  P:"Pisani računi", E:"Mjerne jedinice i novac", F:"Skupovi", G:"Algebarski izrazi", H:"Kvadrati", I:"Jednadžbe", J:"Nejednadžbe",
  X:"Bonus · tablica", Y:"Bonus · dijeljenje i desetice", Z:"Bonus · pisani računi i jednadžba" };
const zrna = n => (n % 10 === 1 && n % 100 !== 11) ? "zrno" : "zrna";

function factKey(x, y) { return Math.min(x, y) + "x" + Math.max(x, y); }
function usedFacts(list, sinceKey) {
  const used = new Set();
  for (const ses of list) { if (ses.date < sinceKey) continue;
    for (const a of ses.answers || []) {
      let m = String(a.prompt).match(/^(\d+) · (\d+)$/); if (m) { used.add(factKey(+m[1], +m[2])); continue; }
      m = String(a.prompt).match(/^(\d+) : (\d+)$/); if (m && +m[1] % +m[2] === 0 && +m[1] <= 100) used.add(factKey(+m[2], +m[1] / +m[2])); } }
  return used;
}
function bonusItems(exclude = new Set()) {
  const out = [], seen = new Set(exclude);
  const pool = [];
  for (let a = 6; a <= 9; a++) for (let b = 3; b <= 9; b++) { const k = factKey(a, b); if (!seen.has(k)) { seen.add(k); pool.push([a, b]); } }
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  shuffle(pool);
  if (pool.length < 5) pool.push(...shuffle([...exclude].map(k => k.split("x").map(Number)).filter(([x, y]) => x >= 3 && y >= 3)).slice(0, 5 - pool.length));

function computeStreak(doneSet, today) {
  let n = 0; const d = new Date(today);
  if (!doneSet.has(key(d))) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 500; i++) {
    const wd = d.getDay();
    if (doneSet.has(key(d))) n++;
    else if (wd !== 0 && wd !== 6) break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
function weekStrip(doneSet, today) {
  const start = new Date(today); const wd = (start.getDay() + 6) % 7; start.setDate(start.getDate() - wd);
  let h = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = key(d), isToday = k === key(today);
    const st = doneSet.has(k) ? "done" : (d.getDay() === 0 ? "rest" : (isToday ? "today" : "empty"));
    h += `<div>${seedSvg(st)}<span>${DAYNAMES[d.getDay()]}</span></div>`;
  }
  return `<div class="week">${h}</div>`;
}

  else {
    const inp = $("#ans"), go = $("#go");
    inp.focus();
    inp.oninput = () => { go.disabled = !inp.value.trim(); };
    inp.onkeydown = e => { if (e.key === "Enter" && inp.value.trim()) finish(inp.value.trim(), false); };
    go.onclick = () => finish(inp.value.trim(), false);
  }

}

function record(it, given, skipped, ms) {
  run.queue.shift();
  const correct = !skipped && norm(given) === norm(it.answer);
  run.s.answers.push({ id: it.id, prompt: it.prompt, answer: it.answer, given, correct, skipped, ms, ladderOf: it.ladderOf || null, at: new Date().toISOString() });
  if (!it.ladderOf) {
    run.mainDone++;
    if (!correct && it.ladder) run.queue.unshift(...it.ladder.map(l => ({ ...l, ladderOf: it.id })));
  }
  run.s.activeMs = Math.round(elapsed());
  saveSession(run.s);
  shell(`<div class="card"><p class="saved">Spremljeno!</p></div>`, false);
  setTimeout(nextStep, 550);
}

async function toJpeg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({ decode: true }); i.src = url; });
    const sc = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej({}), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

  $("#toLara").onclick = e => { e.preventDefault(); location.hash = ""; };
}
/* plain-text body: lines starting "## " = subheading, "- " = bullet; everything escaped */
function richText(t) {
  const out = []; let list = null;
  for (const raw of String(t || "").split("\n")) {
    const line = raw.trim();
    if (line.startsWith("- ")) { (list ||= []).push(`<li>${esc(line.slice(2))}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (!line) continue;
    out.push(line.startsWith("## ") ? `<h4>${esc(line.slice(3))}</h4>` : `<p>${esc(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
function reportsView() {
  const list = [...reports].sort((a, b) => (b.date || "").localeCompare(a.date || "") || (a.type === "weekly" ? -1 : 1));
  parentShell("#izvjestaji", list.length ? list.map((r, i) => `<details class="card rep" ${i === 0 ? "open" : ""}><summary><span class="pill ${r.type === "weekly" ? "ok" : "skip"}">${r.type === "weekly" ? "Tjedni" : "Dnevni"}</span> ${esc(r.title || "")} · ${r.date ? fmtDate(r.date) : ""}</summary>
      <div class="body">${richText(r.body)}</div><p class="small muted">Napisao Claude iz Larinih podataka. Brojke su iz baze; zaključci su procjena, ne dijagnoza.</p></details>`).join("")
    : `<div class="card"><p class="muted">Tjedni izvještaj stiže nedjeljom ujutro i zatvara tjedan.</p></div>`);
}
function observationsView() {
  const list = [...observations].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const ST = { prati: ["skip", "Pratimo"], defektologinja: ["no", "Za defektologinju"], podijeljeno: ["ok", "Podijeljeno"], zatvoreno: ["ok", "Zatvoreno"] };
  parentShell("#opazanja", `<div class="card"><h3>Dodaj opažanje</h3>
      <label class="small" for="obsT">Što si primijetila?</label><textarea class="answer" id="obsT" placeholder="npr. Danas je brojala na prste kod 7 · 8"></textarea>
      <p class="small" id="obsMsg" role="status"></p><button class="btn" id="obsAdd">Spremi opažanje</button></div>
    ${list.length ? list.map(o => { const st = ST[o.status] || ST.prati; return `<div class="card"><h3>${esc(o.title || "Opažanje")}</h3>
      <p class="small muted">${o.date ? fmtDate(o.date) : ""} · ${o.source === "roditelj" ? "ti" : "Claude"} · <span class="pill ${st[0]}">${st[1]}</span></p>
      ${o.text ? `<p>${esc(o.text)}</p>` : ""}
      ${o.evidence?.length ? `<ul class="obs-ev">${o.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      <div class="row">${Object.entries(ST).filter(([k]) => k !== (o.status || "prati")).map(([k, v]) => `<button class="btn ghost" data-obs="${o.id}" data-st="${k}" style="min-height:38px;padding:6px 12px;font-size:.9rem;flex:none">${v[1]}</button>`).join("")}</div></div>`; }).join("")
    : `<div class="card"><p class="muted">Ovdje se bilježe obrasci koje vrijedi pratiti ili pokazati defektologinji, s konkretnim primjerima.</p></div>`}`);
  $("#obsAdd").onclick = async () => {
    const text = $("#obsT").value.trim(); if (!text) { $("#obsMsg").textContent = "Upiši opažanje."; return; }
    const o = { id: "o" + Date.now().toString(36), date: key(new Date()), title: text.length > 60 ? text.slice(0, 57) + "…" : text, text, evidence: [], status: "prati", source: "roditelj", createdAt: new Date().toISOString() };
    const { id, ...body } = o;
    try { await db.doc("observations/" + id).set(body); observations.push(o); observationsView(); }
    catch (_) { $("#obsMsg").textContent = "Opažanje se nije spremilo. Pokušaj ponovno."; }
  };
  app.querySelectorAll("[data-obs]").forEach(b => b.onclick = async () => {
    const o = observations.find(x => x.id === b.dataset.obs); if (!o) return;
    const prev = o.status; o.status = b.dataset.st; const { id, ...body } = o;
    try { await db.doc("observations/" + id).set(body); } catch (_) { o.status = prev; }
    observationsView();
  });
}

/* ---------- parent PIN ---------- */
let unlocked = false, memPin = null;
async function hashPin(pin) {
  const data = new TextEncoder().encode("sipak:" + pin);
  try { const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  catch (_) { let x = 0; for (const b of data) x = (x * 31 + b) >>> 0; return "f" + x.toString(16); }
}
async function loadPin() {
  if (!db) return memPin;
  try { const d = await db.doc("settings/pin").get(); return d.exists ? d.data().hash : null; } catch (_) { return null; }
}
async function savePin(hash) {
  if (!db) { memPin = hash; return true; }
  try { await db.doc("settings/pin").set({ hash, setAt: new Date().toISOString() }); return true; } catch (_) { return false; }
}
async function pinGate() {
  const existing = await loadPin();
  const field = (id, label) => `<label class="small" for="${id}">${label}</label><input class="answer" id="${id}" type="password" inputmode="numeric" maxlength="4" autocomplete="off">`;
  app.innerHTML = `<div class="topbar"><div class="brand">${LOGO}<span>Šipak</span></div><a href="#" id="toLara">Larin prikaz</a></div>
    <div class="card"><h2>${existing ? "Upiši PIN" : "Postavi PIN za roditelja"}</h2>
      ${existing ? field("pin1", "PIN (4 znamenke)") : `<p class="small muted">Pregled za roditelja bit će zaključan ovim PIN-om.</p>${field("pin1", "Novi PIN (4 znamenke)")}${field("pin2", "Ponovi PIN")}`}
      <p class="small" id="pinmsg" role="status"></p>
      <button class="btn" id="pingo">${existing ? "Otključaj" : "Spremi PIN"}</button></div>`;
  $("#toLara").onclick = e => { e.preventDefault(); location.hash = ""; };
  const p1 = $("#pin1"), p2 = $("#pin2"), msg = $("#pinmsg");
  p1.focus();
  const go = async () => {
    const v = p1.value.trim();
    if (!/^\d{4}$/.test(v)) { msg.textContent = "PIN mora imati točno 4 znamenke."; return; }
    if (existing) {
      if ((await hashPin(v)) === existing) { unlocked = true; route(); }
      else { msg.textContent = "PIN nije točan."; p1.value = ""; p1.focus(); }
    } else {
      if (v !== p2.value.trim()) { msg.textContent = "PIN-ovi se ne podudaraju."; return; }
      if (await savePin(await hashPin(v))) { unlocked = true; route(); }
      else msg.textContent = "PIN se nije spremio. Pokušaj ponovno.";
    }
  };
  $("#pingo").onclick = go;
  [p1, p2].forEach(i => i && (i.onkeydown = e => { if (e.key === "Enter") go(); }));
}

/* ---------- login (once per device) ---------- */
function loginView(msg = "") {
  app.innerHTML = `<div class="topbar"><div class="brand">${LOGO}<span>Šipak</span></div></div>
    <div class="card"><h2>Prijava</h2><p class="small muted">Prijavu radi roditelj, jednom na ovom uređaju. Nakon toga Šipak ostaje prijavljen.</p>
      <label class="small" for="em">Email</label><input class="answer" id="em" type="email" autocomplete="username" style="font-size:1.1rem">
      <label class="small" for="pw">Lozinka</label><input class="answer" id="pw" type="password" autocomplete="current-password" style="font-size:1.1rem">
      <p class="small" id="lmsg" role="status">${esc(msg)}</p>
      <button class="btn" id="lgo">Prijavi se</button></div>`;
  const go = async () => {
    $("#lmsg").textContent = "Prijavljujem…";
    try { await signIn($("#em").value.trim(), $("#pw").value); db = sbdb; assets = sbassets; offline = false; await refresh(); }
    catch (e) { $("#lmsg").textContent = e.code === "bad_login" ? "Email ili lozinka nisu točni." : "Prijava trenutno ne radi. Provjeri internet i pokušaj ponovno."; }
  };
  $("#lgo").onclick = go; $("#pw").onkeydown = e => { if (e.key === "Enter") go(); };
}

/* ---------- boot & routing ---------- */
let reports = [], observations = [];
async function loadAll(table) { if (!db) return []; try { const q = await db.collection(table).get(); return q.docs.map(d => ({ id: d.id, ...d.data() })); } catch (_) { return []; } }
async function refresh() { [sessions, requests, reports, observations] = await Promise.all([loadSessions(), loadRequests(), loadAll("reports"), loadAll("observations")]); route(); }
const PARENT_VIEWS = { "#roditelj": () => parent(), "#dani": () => daysView(), "#izvjestaji": () => reportsView(), "#opazanja": () => observationsView() };
function route() { if (run) return; const v = PARENT_VIEWS[location.hash]; if (v) { unlocked ? v() : pinGate(); } else { unlocked = false; home(); } }
window.addEventListener("hashchange", () => { if (!run) refresh(); });
(async () => {
  if (!auth.refresh) return loginView();
  try { await token(); } catch (e) { if (e.code === "login") return loginView(); offline = true; }
  db = sbdb; assets = sbassets;
  await refresh();
})();
</script>
